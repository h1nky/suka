<!DOCTYPE html>
<html>
<body>
<audio id="myAudio" preload="auto">
  <source src="https://www.myinstants.com/media/sounds/foto_btYFRHF.mp3" type="audio/mpeg">
</audio>

<script>
  const audio = document.getElementById('myAudio');
  audio.load(); // предзагрузка

  // Показываем окно при загрузке страницы
  window.addEventListener('load', () => {
    const ok = confirm('Воспроизвести звук?');
    if (ok) {
      audio.play().catch(e => console.log('Ошибка:', e));
    }
  });
</script>
</body>
</html>
